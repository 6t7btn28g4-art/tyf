   V9 / CINEMATIC HORIZONTAL-SLICE REVEAL
   The reference video used full-bleed portrait imagery and horizontal
   shutter-like transitions. This section recreates the interaction
   with Saijo imagery while keeping text/shape cues for UD.
   ========================================================= */
.cinematic-reveal{position:relative;height:340svh;background:#0a0a0a;color:#fff;border-top:1px solid #111;border-bottom:1px solid #111}
.cinematic-sticky{position:sticky;top:0;height:100svh;min-height:680px;overflow:hidden;isolation:isolate;background:#111}
.cinema-base,.cinema-strip{position:absolute;inset:0;margin:0;overflow:hidden}
.cinema-base img,.cinema-strip img{width:100%;height:100%;object-fit:cover;object-position:center;filter:saturate(.84) contrast(1.06)}
.cinema-scene-a{z-index:1;opacity:1}.cinema-scene-b,.cinema-scene-c{z-index:1;opacity:0}
.cinema-strip-layer{position:absolute;inset:0;z-index:3;pointer-events:none}
.cinema-strip{will-change:transform,opacity;opacity:0}
.cinema-tone{position:absolute;inset:0;z-index:4;pointer-events:none;background:linear-gradient(90deg,rgba(244,118,52,.78),rgba(240,139,71,.50) 58%,rgba(255,170,80,.18));mix-blend-mode:color}

@keyframes cinemaGrain{0%{transform:translate(0,0)}25%{transform:translate(1.2%,-.8%)}50%{transform:translate(-.7%,1.1%)}75%{transform:translate(.8%,.5%)}100%{transform:translate(0,0)}}

.site-opening.is-running .opening-image{animation:openingImage 1.45s .18s cubic-bezier(.2,.8,.2,1) forwards}

.opening-wipes i:nth-child(even){--from:102%;--to:-102%}

/* =========================================================
   v12 / REFINED TOP PHOTOGRAPHY
   UD logic is intentionally untouched. This block only
   adjusts the home-page photographic composition.
   ========================================================= */

/* Hero: turn the oversized full-bleed image into an editorial frame. */
.mb-home .mb-hero{
  min-height:720px;
  height:min(88svh,860px);
  background:
    radial-gradient(circle at 75% 24%,rgba(255,255,255,.06),transparent 30%),
    linear-gradient(135deg,#0b1017 0%,#111923 55%,#091017 100%);
  overflow:hidden;
}
.mb-home .mb-hero-media{
  left:auto;
  right:clamp(28px,4vw,72px);
  top:clamp(82px,9vh,118px);
  bottom:clamp(86px,9vh,124px);
  width:min(49vw,760px);
  height:auto;
  border-radius:2px;
  overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,.34);
  clip-path:inset(0);
}
.mb-home .mb-hero-media:before{
  content:"";
  position:absolute;
  z-index:2;
  inset:0;
  border:1px solid rgba(255,255,255,.24);
  pointer-events:none;
}
.mb-home .mb-hero-media:after{
  content:"PHOTO / SAIJO 001";
  position:absolute;
  z-index:3;
  right:14px;
  bottom:12px;
  padding:5px 7px;
  background:rgba(8,13,18,.62);
  color:#fff;
  font-size:7px;
  font-weight:800;
  letter-spacing:.16em;
  backdrop-filter:blur(8px);
}
.mb-home .mb-hero-media img{
  width:100%;height:100%;object-fit:cover;object-position:center 58%;
  filter:saturate(.88) contrast(1.04) brightness(.94);
}
.mb-home .mb-hero-mask{
  background:linear-gradient(90deg,#0b1017 0 42%,rgba(11,16,23,.93) 48%,rgba(11,16,23,.36) 65%,transparent 82%);
}
.mb-home .mb-hero-copy{
  width:min(50vw,780px);
  padding-left:var(--pad);
  padding-right:0;
  justify-content:center;
}
.mb-home .mb-hero-copy h1{
  font-size:clamp(76px,9.2vw,150px);
  line-height:.76;
  max-width:760px;
}
.mb-home .mb-hero-copy .hero-ja{
  margin-left:clamp(120px,13vw,240px);
  margin-top:26px;
  max-width:360px;
}
.mb-home .mb-hero-index{right:clamp(34px,4vw,74px);bottom:30px}
.mb-home .mb-hero-notes{left:var(--pad);bottom:34px}
.mb-home .hero-open{left:var(--pad);bottom:92px}
.mb-home .hero-scroll{right:calc(min(49vw,760px) + clamp(42px,5vw,90px));bottom:22px}

/* Photo Index: smaller, gallery-like pictures with visible breathing room. */
.photo-atlas{padding-bottom:clamp(70px,7vw,110px)}
.photo-atlas-head{padding-top:clamp(90px,9vw,138px);padding-bottom:34px}
.photo-atlas-head h2{font-size:clamp(52px,7.6vw,118px);line-height:.78}
.photo-atlas-grid{
  max-width:1440px;
  margin:0 auto;
  grid-template-columns:repeat(12,1fr);
  grid-auto-rows:56px;
  gap:16px;
  padding:0 max(var(--pad),24px);
}
.atlas-card{min-height:170px;background:#141414}
.atlas-card span{left:14px;top:14px;font-size:7px}
.atlas-card b{left:14px;right:48px;bottom:14px;font-size:clamp(17px,1.5vw,25px)}
.atlas-card i{right:12px;bottom:12px;width:32px;height:32px}
.atlas-kuguri{grid-column:1/6;grid-row:1/6}
.atlas-kamotsuru{grid-column:6/9;grid-row:1/5}
.atlas-hakubotan{grid-column:9/12;grid-row:1/5}
.atlas-kirei{grid-column:6/10;grid-row:5/9}
.atlas-around{grid-column:10/13;grid-row:5/9}

/* Cinematic section remains expressive, but no longer fills several giant screens. */
.cinematic-reveal{height:220svh}
.cinematic-sticky{height:78svh;min-height:560px;max-height:760px;top:11svh}
.cinema-copy h2{font-size:clamp(72px,9vw,144px)}
.cinema-caption{width:min(390px,36vw)}

/* Pickup cards: more editorial whitespace, less photo dominance. */
.mb-pickup{padding-top:clamp(90px,9vw,140px)}
.mb-work-grid{
  max-width:1460px;
  margin:0 auto;
  gap:22px;
}
.mb-work{min-height:0;box-shadow:none;border:1px solid var(--line);background:var(--paper2)}
.mb-work figure{height:clamp(210px,25vw,360px)}
.mb-work-main figure{height:clamp(250px,28vw,390px)}
.mb-work-tall figure{height:clamp(260px,31vw,420px)}
.mb-work-wide figure{height:clamp(190px,22vw,300px)}
.mb-work .mb-work-meta{padding:18px 18px 20px;background:var(--paper2);color:var(--ink)}
.mb-work .mb-work-meta span,.mb-work .mb-work-meta small{color:var(--muted)}
.mb-work .mb-work-meta b{font-size:clamp(20px,2vw,30px)}
.mb-work>i{color:var(--ink);border-color:var(--line)}

/* Real-photo strip further down the home page: keep it compact. */
.mb-photo-pair{display:grid!important;grid-template-columns:1fr 1fr;gap:8px}
.mb-photo-pair img{position:relative!important;width:100%!important;height:100%!important;object-fit:cover!important}

@media(max-width:980px){
  .mb-home .mb-hero{height:760px;min-height:700px}
  .mb-home .mb-hero-media{right:28px;top:105px;bottom:130px;width:55vw}
  .mb-home .mb-hero-copy{width:52vw}
  .mb-home .mb-hero-copy h1{font-size:clamp(68px,10vw,112px)}
  .mb-home .mb-hero-copy .hero-ja{margin-left:70px}
  .photo-atlas-grid{grid-auto-rows:52px;gap:12px}
  .atlas-kuguri{grid-column:1/7}.atlas-kamotsuru{grid-column:7/10}.atlas-hakubotan{grid-column:10/13}
  .atlas-kirei{grid-column:7/11;grid-row:5/9}.atlas-around{grid-column:11/13;grid-row:5/9}
}

@media(max-width:720px){
  .mb-home .mb-hero{height:auto;min-height:780px;padding-bottom:88px}
  .mb-home .mb-hero-media{
    left:20px;right:20px;top:96px;bottom:auto;width:auto;height:42vh;min-height:310px;max-height:430px;
  }
  .mb-home .mb-hero-mask{
    background:linear-gradient(180deg,rgba(5,11,17,.08) 0,rgba(5,11,17,.16) 40%,#090d12 71%,#090d12 100%);
  }
  .mb-home .mb-hero-copy{width:auto;min-height:780px;padding:470px 20px 0;justify-content:flex-start}
  .mb-home .mb-hero-copy h1{font-size:16.8vw;line-height:.77}
  .mb-home .mb-hero-copy .hero-ja{margin:18px 0 0;max-width:none}
  .mb-home .hero-open{left:20px;right:20px;bottom:28px;width:auto}
  .mb-home .mb-hero-index,.mb-home .mb-hero-notes,.mb-home .hero-scroll{display:none}

  .photo-atlas-head{padding:78px 20px 30px}.photo-atlas-head h2{font-size:16vw}
  .photo-atlas-grid{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:auto;gap:10px;padding:0 20px;margin:0;overflow:visible}
  .atlas-card{grid-column:auto!important;grid-row:auto!important;min-height:0;height:220px;scroll-snap-align:none}
  .atlas-kuguri{grid-column:1/3!important;height:280px}
  .atlas-around{grid-column:1/3!important;height:210px}
  .atlas-card b{font-size:19px}

  .cinematic-reveal{height:180svh}.cinematic-sticky{top:9svh;height:72svh;min-height:520px}
  .cinema-copy{padding:95px 20px 78px}.cinema-copy h2{font-size:15vw}

  .mb-work-grid{display:grid;grid-template-columns:1fr;gap:14px;padding:0 20px}
  .mb-work figure,.mb-work-main figure,.mb-work-tall figure,.mb-work-wide figure{height:240px}
}

@media(prefers-reduced-motion:reduce){

}

/* =========================================================
   v13 / COLOR APPEARANCE BAR RESTORE
   Keeps the UD flow intact. A dedicated gradient layer sits
   under the range input so the bar remains visible on Safari,
   iOS, Chromium and Firefox.
   ========================================================= */
.vision-slider-wrap{
  position:relative;
}
.vision-range-stack{
  position:relative;
  width:100%;
  height:52px;
  display:flex;
  align-items:center;
  isolation:isolate;
}
.vision-color-bar{
  position:absolute;
  z-index:0;
  left:2px;
  right:2px;
  top:50%;
  height:26px;
  transform:translateY(-50%);
  border-radius:999px;
  background:linear-gradient(90deg,
    #6a54c6 0%,
    #2a77d4 21%,
    #129b82 42%,
    #d8b128 64%,
    #c87530 78%,
    #d71920 100%);
  box-shadow:
    inset 0 0 0 2px rgba(255,255,255,.76),
    0 0 0 1px rgba(16,37,62,.28),
    0 5px 16px rgba(16,37,62,.09);
  pointer-events:none;
}
/* No color name is shown. This small outlined area only marks
   the reference-end position that retains the standard palette. */
.vision-standard-zone{
  position:absolute;
  z-index:1;
  right:-3px;
  top:50%;
  width:12%;
  min-width:34px;
  height:38px;
  transform:translateY(-50%);
  border:2px dashed rgba(16,37,62,.58);
  border-radius:999px;
  pointer-events:none;
}
.vision-slider{
  position:relative;
  z-index:2;
  width:100%;
  height:52px;
  margin:0;
  padding:0;
  appearance:none;
  -webkit-appearance:none;
  background:transparent!important;
  border:0;
  box-shadow:none!important;
  cursor:pointer;
}
.vision-slider::-webkit-slider-runnable-track{
  height:26px;
  border:0;
  border-radius:999px;
  background:transparent;
  box-shadow:none;
}
.vision-slider::-moz-range-track{
  height:26px;
  border:0;
  border-radius:999px;
  background:transparent;
  box-shadow:none;
}
.vision-slider::-moz-range-progress{
  height:26px;
  background:transparent;
}
.vision-slider::-webkit-slider-thumb{
  position:relative;
  z-index:4;
  -webkit-appearance:none;
  appearance:none;
  width:46px;
  height:46px;
  margin-top:-10px;
  border:7px solid #fff;
  border-radius:50%;
  background:var(--navy);
  box-shadow:0 7px 22px rgba(16,37,62,.34),0 0 0 3px var(--navy);
}
.vision-slider::-moz-range-thumb{
  width:32px;
  height:32px;
  border:7px solid #fff;
  border-radius:50%;
  background:var(--navy);
  box-shadow:0 7px 22px rgba(16,37,62,.34),0 0 0 3px var(--navy);
}
.vision-slider:focus-visible{
  outline:4px solid var(--focus);
  outline-offset:5px;
  border-radius:999px;
}
/* The older decorative pseudo-zone is replaced by the explicit
   element above to prevent it from covering the gradient. */
.vision-slider-wrap:before{display:none!important}
html.high-contrast .vision-color-bar{
  box-shadow:inset 0 0 0 3px #000,0 0 0 2px #fff;
}
html.high-contrast .vision-standard-zone{border-color:#000;border-width:3px}

/* =========================================================
   v19 / COLOR-VISION APPEARANCE CHECK
   Pseudoisochromatic-style preference UI inspired by established
   color-vision screening concepts and CUD slider tools. This is not
   a clinical test. No "correct red" or standard endpoint is exposed.
   ========================================================= */
.vision-plate{
  position:relative;
  width:min(100%,390px);
  aspect-ratio:1.28/1;
  margin-inline:auto;
  padding:18px;
  overflow:hidden;
  border:1px solid rgba(16,37,62,.18);
  border-radius:50%;
  background:#e8e1cc;
  box-shadow:inset 0 0 0 8px rgba(255,255,255,.58),0 16px 42px rgba(16,37,62,.11);
}
.vision-plate:before{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(circle at 32% 23%,rgba(255,255,255,.34),transparent 29%),radial-gradient(circle at 70% 74%,rgba(16,37,62,.05),transparent 35%);
  pointer-events:none;
}
.vision-dot-field{
  position:relative;
  z-index:1;
  width:100%;
  height:100%;
  display:grid;
  grid-template-columns:repeat(9,1fr);
  grid-template-rows:repeat(7,1fr);
  gap:clamp(3px,.75vw,7px);
  place-items:center;
}
.vision-dot-field i{
  display:block;
  width:clamp(13px,2.45vw,27px);
  aspect-ratio:1;
  border-radius:50%;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.13);
}
.vision-dot-field i:nth-child(4n){transform:scale(.78)}
.vision-dot-field i:nth-child(5n){transform:scale(1.12)}
.vision-dot-field i:nth-child(7n){transform:translate(2px,-1px) scale(.9)}
.vision-dot-field i.noise.a{background:var(--plate-bg-a)}
.vision-dot-field i.noise.b{background:var(--plate-bg-b)}
.vision-dot-field i.signal.a{background:var(--plate-sig-a)}
.vision-dot-field i.signal.b{background:var(--plate-sig-b)}
.vision-plate-frame{
  position:absolute;
  z-index:2;
  inset:11px;
  border:1px solid rgba(255,255,255,.55);
  border-radius:50%;
  pointer-events:none;
}
.vision-calibrator-plate{
  grid-template-columns:minmax(250px,.72fr) minmax(0,1.28fr)!important;
  align-items:center;
}
.vision-calibrator-plate .vision-control{align-self:center}
.vision-range-stack.neutral{height:52px}
.vision-neutral-track{
  position:absolute;
  z-index:0;
  left:2px;
  right:2px;
  top:50%;
  height:18px;
  transform:translateY(-50%);
  border:1px solid rgba(16,37,62,.24);
  border-radius:999px;
  background:repeating-linear-gradient(90deg,#e9e6de 0 18px,#d9dde0 18px 36px);
  box-shadow:inset 0 1px 2px rgba(16,37,62,.08);
  pointer-events:none;
}
.vision-range-stack.neutral .vision-slider::-webkit-slider-runnable-track{height:18px}
.vision-range-stack.neutral .vision-slider::-moz-range-track{height:18px}
.vision-range-stack.neutral .vision-slider::-webkit-slider-thumb{margin-top:-14px}
.vision-range-stack.neutral .vision-slider::-moz-range-thumb{margin-top:0}
.first-color-panel .compact-vision-calibrator{
  display:grid;
  grid-template-columns:minmax(210px,.72fr) minmax(0,1.28fr);
  gap:18px;
  align-items:center;
}
.first-color-panel .compact-vision-calibrator .vision-plate{grid-row:1/5;width:min(100%,290px)}
.first-color-panel .compact-vision-calibrator .vision-instruction,
.first-color-panel .compact-vision-calibrator .vision-slider-wrap,
.first-color-panel .compact-vision-calibrator .vision-auto{grid-column:2}
.first-color-panel .compact-vision-calibrator .vision-instruction{margin-top:0!important}
html.high-contrast .vision-neutral-track{border:2px solid #000;background:repeating-linear-gradient(90deg,#fff 0 18px,#cfcfcf 18px 36px)}
html.high-contrast .vision-plate{border:3px solid #000}

@media(max-width:900px){
  .first-color-panel .compact-vision-calibrator{grid-template-columns:150px minmax(0,1fr);gap:10px}
  .first-color-panel .compact-vision-calibrator .vision-plate{width:145px;padding:10px}
  .vision-dot-field{gap:3px}
  .vision-dot-field i{width:clamp(9px,2.7vw,17px)}
  .vision-calibrator-plate{grid-template-columns:170px minmax(0,1fr)!important;gap:12px!important}
}
@media(max-width:560px){

  .first-color-panel .compact-vision-calibrator .vision-instruction,

/* =========================================================
   v22 / SYMBOL-READABLE RANDOM COLOR CHECK
   At the hidden reference position the dot mask resolves into a clear
   randomized symbol. Symbol identity and reference position remain hidden.
   ========================================================= */
.vision-dot-field{gap:clamp(2px,.55vw,5px)}
.vision-dot-field i{box-shadow:inset 0 0 0 1px rgba(255,255,255,.10),0 0 0 .35px rgba(16,37,62,.05)}
.vision-plate{background:#e6dfc9}
@media(max-width:720px){
  .vision-dot-field{gap:2.5px}
  .vision-dot-field i{width:clamp(11px,3.2vw,18px)}
}


/* =========================================================
   v23 / CLEAR SYMBOL PLATE
   The symbol is deliberately larger and thicker. At a visibility peak the
   signal dots become crisp enough to read as a symbol; between peaks they
   blend back into the dot field. The hidden reference itself is not shown.
   ========================================================= */
.vision-plate{
  width:min(100%,430px);
  aspect-ratio:1.18/1;
  padding:22px;
}
.vision-dot-field{
  grid-template-columns:repeat(9,1fr);
  grid-template-rows:repeat(9,1fr);
  gap:clamp(1.5px,.42vw,4px);
}
.vision-dot-field i{
  width:clamp(16px,2.65vw,30px);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.15),0 1px 2px rgba(16,37,62,.07);
}
.vision-dot-field i.signal{
  transform:scale(calc(.90 + var(--plate-visibility,0) * .14));
}
.first-color-panel .compact-vision-calibrator .vision-plate{
  width:min(100%,320px);
}
@media(max-width:900px){
  .first-color-panel .compact-vision-calibrator{grid-template-columns:190px minmax(0,1fr)}
  .first-color-panel .compact-vision-calibrator .vision-plate{width:185px;padding:12px}
  .vision-dot-field i{width:clamp(13px,3.1vw,20px)}
}
@media(max-width:560px){
  .first-color-panel .compact-vision-calibrator .vision-plate{width:190px;padding:12px}
  .vision-dot-field{gap:2px}
  .vision-dot-field i{width:17px}
}

/* =========================================================
   v24 / SMALL-DOT FULL-SYMBOL PLATE
   Keep the whole 9x9 symbol inside the plate. Dots are intentionally
   smaller, spacing is tighter, and the plate is square/circular so the
   corners of symbols such as ×, □ and → are never clipped.
   ========================================================= */
.vision-plate{
  width:min(100%,380px);
  aspect-ratio:1 / 1;
  padding:50px;
  border-radius:50%;
}
.vision-dot-field{
  grid-template-columns:repeat(9,minmax(0,1fr));
  grid-template-rows:repeat(9,minmax(0,1fr));
  gap:clamp(2px,.32vw,4px);
  width:100%;
  height:100%;
}
.vision-dot-field i{
  width:clamp(8px,1.35vw,16px);
  max-width:72%;
  justify-self:center;
  align-self:center;
}
.vision-dot-field i:nth-child(4n),
.vision-dot-field i:nth-child(5n),
.vision-dot-field i:nth-child(7n){
  /* Keep texture variation subtle so it never crops the symbol. */
  transform:none;
}
.first-color-panel .compact-vision-calibrator .vision-plate{
  width:min(100%,270px);
  padding:36px;
}
@media(max-width:900px){
  .first-color-panel .compact-vision-calibrator{grid-template-columns:210px minmax(0,1fr)}
  .first-color-panel .compact-vision-calibrator .vision-plate{width:205px;padding:28px}
  .vision-dot-field{gap:2px}
  .vision-dot-field i{width:clamp(7px,1.8vw,12px);max-width:68%}
}
@media(max-width:560px){
  .first-color-panel .compact-vision-calibrator{grid-template-columns:1fr}
  .first-color-panel .compact-vision-calibrator .vision-plate{width:220px;padding:29px}

  .vision-dot-field{gap:2px}
  .vision-dot-field i{width:10px;max-width:66%}
}

  .vision-dot-field i{width:9px}
}

/* ===== Sections ===== */
.v45-section{padding:clamp(72px,9vw,130px) clamp(22px,5vw,78px);position:relative}.v45-section-head{display:grid;grid-template-columns:minmax(240px,.8fr) minmax(0,1.2fr);gap:28px;align-items:end;margin-bottom:34px}.v45-section-head span{grid-column:1/-1;font-size:11px;letter-spacing:.15em;font-weight:900;color:var(--v45-water)}.v45-section-head h2{margin:0;font-size:clamp(40px,5.8vw,86px);line-height:.95;letter-spacing:-.065em}.v45-section-head p{max-width:520px;justify-self:end;margin:0;font-size:15px;line-height:1.75;color:var(--v45-ink2)}

.v45-brewery-band{background:#0a3341;color:#fff}.v45-brewery-band .v45-section-head p{color:#c7e6ed}.v45-brewery-band .v45-section-head span{color:#6fd9ea}.v45-snap-track{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(270px,31vw);gap:14px;overflow-x:auto;overscroll-behavior-inline:contain;scroll-snap-type:x mandatory;padding-bottom:16px;cursor:grab;scrollbar-width:thin;scrollbar-color:#58cde0 rgba(255,255,255,.08)}.v45-snap-track.dragging{cursor:grabbing;scroll-snap-type:none;user-select:none}.v45-snap-track a{scroll-snap-align:start;position:relative;min-height:500px;border-radius:26px;overflow:hidden;text-decoration:none;color:#fff;background:#0d5367;isolation:isolate}.v45-snap-track img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:.5s ease}.v45-snap-track a:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(4,29,38,.8));z-index:1}.v45-snap-track a span,.v45-snap-track a b{position:absolute;z-index:2;left:20px}.v45-snap-track a span{top:20px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--v45-ink);font-size:11px;font-weight:900}.v45-snap-track a b{bottom:22px;font-size:24px}.v45-snap-track a:hover img{transform:scale(1.035)}

/* ===== Existing inner pages reshaped into the new system ===== */

.spot-editorial{display:grid!important;grid-template-columns:auto 1fr!important;grid-template-rows:auto auto!important;gap:16px!important}.spot-visual{grid-column:1/-1!important;display:grid!important;grid-template-columns:1.15fr .85fr!important;gap:10px!important}.spot-photo,.spot-mini{min-height:280px!important;border-radius:20px!important;overflow:hidden!important}.spot-photo img{width:100%!important;height:100%!important;object-fit:cover!important}.spot-num{font-size:14px!important;color:var(--v45-water)!important;font-weight:900!important}

/* Products keep personality, but become clear and easy to select. */
.bubble-stage{min-height:calc(100svh - 90px)!important;padding:110px clamp(18px,4vw,60px) 50px!important;background:radial-gradient(circle at 80% 10%,rgba(80,210,230,.28),transparent 30%),linear-gradient(180deg,#e7f8fb,#f8fdfe)!important}.bubble-stage-copy{max-width:650px!important;position:relative!important;z-index:2!important}.bubble-stage-copy h1{font-size:clamp(54px,7vw,96px)!important;line-height:.9!important;color:var(--v45-ink)!important}.bubble-stage [data-bubbles]{margin-top:34px!important;display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:14px!important;position:relative!important;min-height:0!important}.product-bubble{position:relative!important;left:auto!important;top:auto!important;transform:none!important;width:auto!important;height:auto!important;min-height:280px!important;border-radius:28px!important;padding:16px!important;background:rgba(255,255,255,.92)!important;border:1px solid var(--v45-line)!important;box-shadow:0 14px 40px rgba(4,60,77,.08)!important;color:var(--v45-ink)!important;display:flex!important;flex-direction:column!important;text-decoration:none!important;overflow:hidden!important;animation:v45Float 6s ease-in-out infinite!important}.product-bubble:nth-child(2n){animation-delay:-2s!important}.product-bubble:nth-child(3n){animation-delay:-4s!important}@keyframes v45Float{50%{transform:translateY(-8px)!important}}.product-bubble-photo{height:160px!important;margin:0!important;border-radius:20px!important;background:#e9f8fb!important;display:grid!important;place-items:center!important;overflow:hidden!important}.product-bubble-photo img{max-width:78%!important;max-height:145px!important;object-fit:contain!important}.product-bubble>span{position:static!important;background:transparent!important;color:var(--v45-ink)!important;padding:14px 2px 0!important}.product-bubble>span small{color:var(--v45-water)!important;font-weight:900!important}.product-bubble>span b{font-size:19px!important}.product-bubble>span em{display:block!important;margin-top:6px!important;font-style:normal!important;font-size:11px!important;line-height:1.5!important;color:var(--v45-ink2)!important}.product-bubble>i{position:absolute!important;right:16px!important;top:16px!important;width:36px!important;height:36px!important;border-radius:50%!important;background:var(--v45-ink)!important;color:#fff!important;display:grid!important;place-items:center!important;font-style:normal!important}.products-cta{padding:20px clamp(18px,4vw,60px) 70px!important;background:#f8fdfe!important}

/* Footer and utility */
.v45-footer{margin-top:0!important;padding:46px clamp(22px,5vw,72px)!important;background:#082f3d!important;color:#fff!important;display:grid!important;grid-template-columns:1fr 1fr auto!important;align-items:center!important;gap:24px!important}.v45-footer-brand{display:flex;gap:12px;align-items:center}.v45-footer-brand img{width:52px;height:52px;border-radius:50%}.v45-footer-brand div{display:grid}.v45-footer-brand b{font-size:24px}.v45-footer-brand small{font-size:9px;letter-spacing:.12em;color:#95dbe7}.v45-footer p{margin:0!important;color:#cce7ec!important;line-height:1.6}.v45-footer-links{display:flex;gap:8px;flex-wrap:wrap}.v45-footer-links a{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.22);padding:12px 14px;border-radius:12px;font-size:12px;font-weight:900}.v45-footer-links svg{width:16px;height:16px;fill:none;stroke:currentColor;vertical-align:middle}
[data-v45-reveal]{opacity:0;transform:translateY(20px);transition:opacity .55s ease,transform .55s ease}[data-v45-reveal].is-visible{opacity:1;transform:none}
:focus-visible{outline:3px solid #f2a84b!important;outline-offset:3px!important}
body.ud-high-contrast{--v45-ink:#001f29;--v45-water:#006b86;--v45-line:rgba(0,31,41,.45)}
body.ud-reduced-motion *{scroll-behavior:auto!important;animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}

}

/* v51 — stable layout / readable navigation
   This file intentionally loads last and resolves stacking and sticky offsets
   without rewriting the existing cinematic sections. */
:root{
  --v51-nav-z:2400;
  --v51-overlay-z:3200;
  --v51-tablet-header:92px;
  --v51-mobile-header:78px;
  --v51-mobile-dock:82px;
}

/* --- stacking contexts: header must never be trapped below cinematic layers --- */
body:not(.map-page) [data-site-header]{
  position:relative!important;
  z-index:var(--v51-nav-z)!important;
}
body:not(.map-page) main{
  position:relative;
  z-index:10;
}
body:not(.map-page) [data-site-footer]{
  position:relative;
  z-index:10;
}
.global-header.v51-nav{
  z-index:calc(var(--v51-nav-z) + 10)!important;
  isolation:isolate;
}
.v45-menu.site-menu{z-index:var(--v51-overlay-z)!important}
.ud-overlay{z-index:calc(var(--v51-overlay-z) + 100)!important}

/* UD now lives in the main navigation; remove the duplicate floating button. */
body:not(.map-page)>.ud-fab{display:none!important}

/* --- clearer menu --- */
.global-header.v51-nav{
  background:rgba(250,254,255,.965)!important;
  border-color:rgba(7,52,66,.18)!important;
  box-shadow:0 16px 44px rgba(4,44,57,.13)!important;
}
.v51-nav .round-nav-btn{
  color:#0a3341!important;
  font-weight:850!important;
}
.v51-nav .round-nav-btn span{
  font-size:9px!important;
  line-height:1!important;
  letter-spacing:.045em!important;
  white-space:nowrap!important;
}
.v51-nav .round-nav-btn:hover,
.v51-nav .round-nav-btn:focus-visible{
  background:#dff5f9!important;
  color:#072d39!important;
}
.v51-nav .round-nav-btn.is-active{
  background:#0a3341!important;
  color:#fff!important;
}
.v51-nav .v51-ud-nav{
  border:1px solid rgba(10,148,183,.32)!important;
  background:#e5f8fb!important;
}
.v51-nav .v51-ud-nav:hover,
.v51-nav .v51-ud-nav:focus-visible{
  background:#0a94b7!important;
  color:#fff!important;
}

/* Home is cinematic full width; the rail floats above it instead of shrinking it. */
body.v49-home>main,
body.v49-home>.global-footer{
  margin-left:0!important;
}

/* --- layer intro: give it a complete viewport before the sticky stack begins --- */
body.v49-home .v46-layer-intro{
  position:relative;
  z-index:20;
  min-height:100svh!important;
  padding:clamp(120px,15vh,180px) 7vw clamp(84px,11vh,130px)!important;
  grid-template-columns:minmax(130px,180px) minmax(0,1fr)!important;
  align-content:center!important;
  overflow:visible!important;
}
body.v49-home .v46-layer-intro h2{
  max-width:920px!important;
  font-size:clamp(48px,6.6vw,98px)!important;
  line-height:.94!important;
  letter-spacing:-.055em!important;
  overflow-wrap:normal!important;
  word-break:keep-all!important;
}
body.v49-home .v46-layer-intro>div{
  gap:9px 10px!important;
  margin-top:24px!important;
}
body.v49-home .v46-layer-intro>div span{
  padding:9px 13px!important;
  background:#fff!important;
  border:1px solid rgba(8,43,58,.28)!important;
  box-shadow:0 7px 18px rgba(7,52,66,.05)!important;
}

/* --- sticky layers: one explicit stacking system --- */
body.v49-home .v46-layer-stack{
  position:relative!important;
  z-index:30!important;
  isolation:isolate!important;
  overflow:visible!important;
}
body.v49-home .v46-layer{
  top:0;
  z-index:calc(30 + var(--layer-index))!important;
  box-sizing:border-box!important;
}
body.v49-home .v46-layer-top{
  z-index:5!important;
  left:max(124px,8vw)!important;
  right:32px!important;
}
body.v49-home .v46-layer-copy{
  z-index:6!important;
  left:max(124px,8vw)!important;
  bottom:clamp(48px,8vh,92px)!important;
  width:min(680px,calc(100vw - 180px))!important;
  max-height:72vh;
}
body.v49-home .v46-layer-copy>strong{
  font-size:clamp(72px,9.5vw,150px)!important;
  line-height:.7!important;
  margin-bottom:-.08em!important;
}
body.v49-home .v46-layer-copy h3{
  font-size:clamp(46px,6.2vw,94px)!important;
  line-height:.91!important;

  overflow-wrap:normal!important;
}
body.v49-home .v46-layer-copy p{

body.v49-home .v46-layer-tab{z-index:5!important}

/* hero controls never collide with nav */
body.v49-home .v46-hero-copy{z-index:6!important}
body.v49-home .v46-map-cta,
body.v49-home .v46-video-toggle{z-index:7!important}

  }

  }
  body.v49-home .v46-layer-copy h3{font-size:clamp(48px,7.8vw,80px)!important}
}

  }
  body.v49-home .v46-layer-intro>div span{font-size:8px!important;padding:7px 9px!important}

  body.v49-home .v46-layer{

  }
  body.v49-home .v46-layer-top{

"use strict";
(() => {
  const KEY = "saijo-site-prefs-v22";
  const DEFAULTS = {
    colorMode: "safe",
    colorVisionPosition: 50,
    colorVisionOffset: 100,
    language: "ja",
    customLanguage: "",
    customLanguageLabel: "",
    textSize: "normal",
    highContrast: false,
    reduceMotion: false,
    onboardingDone: false,
    languageConfirmed: false,
    colorConfirmed: false
  };

  function load() {
    try {
      return { ...DEFAULTS, ...(JSON.parse(localStorage.getItem(KEY) || "null") || {}) };
    } catch (_) {
      return { ...DEFAULTS };
    }
  }

  function save(next) {
    const merged = { ...load(), ...next };
    try { localStorage.setItem(KEY, JSON.stringify(merged)); } catch (_) {}
    apply(merged);
    syncMap(merged);
    window.dispatchEvent(new CustomEvent("saijo:prefs", { detail: merged }));
    return merged;
  }

  function syncMap(prefs) {
    try {
      const key = "saijo-ud-map-settings-v1";
      const current = JSON.parse(localStorage.getItem(key) || "null") || {};
      const lang = ["ja","en","zh","ko","pt"].includes(prefs.language) ? prefs.language : "ja";
      localStorage.setItem(key, JSON.stringify({
        ...current,
        language: lang,
        textSize: prefs.textSize,
        highContrast: !!prefs.highContrast,
        reduceMotion: !!prefs.reduceMotion
      }));
    } catch (_) {}
  }

  function apply(prefs = load()) {
    const root = document.documentElement;
    root.dataset.colorMode = prefs.colorMode === "standard" ? "standard" : "safe";
    const selectedLang = prefs.language === "custom" && prefs.customLanguage ? prefs.customLanguage : (prefs.language || "ja");
    root.dataset.lang = selectedLang;
    root.dataset.textSize = prefs.textSize || "normal";
    root.classList.toggle("high-contrast", !!prefs.highContrast);
    root.classList.toggle("reduce-motion", !!prefs.reduceMotion);
    root.lang = prefs.language === "custom" && prefs.customLanguage ? prefs.customLanguage : (prefs.language === "zh" ? "zh-CN" : prefs.language === "pt" ? "pt-BR" : prefs.language || "ja");
    root.dir = /^(ar|he|iw)(-|$)/i.test(root.lang) ? "rtl" : "ltr";
  }

  window.SaijoPrefs = { KEY, DEFAULTS, load, save, apply };
  apply();
  syncMap(load());
})();

  /* → */

function visionColors(value){
  const c=createVisionChallenge();
  const v=Math.max(0,Math.min(100,Number(value)||0));

  /*
    The hidden reference is a strong warm-vs-olive separation, so a typical
    trichromatic viewer sees a crisp symbol there. Two additional peaks use
    blue and amber. Between the peaks, signal dots deliberately approach the
    background and the symbol fades. This is an interface preference aid,
    not a clinical colour-vision test.
  */
  const bgA=[137,149,96], bgB=[160,149,102];
  const warmA=[221,68,61],  warmB=[202,82,57];
  const blueA=[0,106,180],  blueB=[38,139,210];
  const amberA=[238,160,0], amberB=[255,194,48];

  const ref=c.target;
  const left=Math.max(6,ref-32);
  const right=Math.min(94,ref+32);
  const peak=(center,width=9)=>Math.exp(-Math.pow((v-center)/width,2));
  const pRef=peak(ref,8.5);
  const pLeft=peak(left,9.5);
  const pRight=peak(right,9.5);

  let strongest=pRef, destA=warmA, destB=warmB;
  if(pLeft>strongest){strongest=pLeft;destA=c.swap?amberA:blueA;destB=c.swap?amberB:blueB}
  if(pRight>strongest){strongest=pRight;destA=c.swap?blueA:amberA;destB=c.swap?blueB:amberB}

  /* Almost no colour separation between peaks; vivid, readable signal at peaks. */
  const visibility=Math.pow(Math.min(1,strongest*1.16),.72);
  const neutralA=mixRgb(bgA,[151,145,103],.32);
  const neutralB=mixRgb(bgB,[150,148,106],.30);
  return {
    bgA:rgb(bgA), bgB:rgb(bgB),
    sigA:rgb(mixRgb(neutralA,destA,visibility)),
    sigB:rgb(mixRgb(neutralB,destB,visibility)),
    visibility
  };
}
function visionPlateStyle(value){
  const c=visionColors(value);
  return `--plate-bg-a:${c.bgA};--plate-bg-b:${c.bgB};--plate-sig-a:${c.sigA};--plate-sig-b:${c.sigB};--plate-visibility:${c.visibility}`;
}
function visionPlateDots(){
  const c=createVisionChallenge();
  const rows=VISION_PATTERNS[c.pattern];
  return rows.join('').split('').map((bit,i)=>{
    const tone=seededUnit(c.seed,i,1)<.46?'a':'b';
    const cls=bit==='1'?`signal ${tone}`:`noise ${tone}`;
    /* v24: smaller, steadier dots keep the entire randomized symbol readable. */
    const scale=(.88+seededUnit(c.seed,i,2)*.18).toFixed(2);
    const dx=((seededUnit(c.seed,i,3)-.5)*1.4).toFixed(1);
    const dy=((seededUnit(c.seed,i,4)-.5)*1.4).toFixed(1);
    return `<i class="${cls}" aria-hidden="true" style="transform:translate(${dx}px,${dy}px) scale(${scale})"></i>`;
  }).join('');
}

async function chooseCustomLanguage(input,status){
 if(customLanguageBusy)return;
 const api=window.SaijoCustomTranslate;
 const resolved=api?.resolveLanguage?.(input);
 if(!resolved?.code){status.textContent=udc('languageCodeError')||'言語名または言語コードを入力してください。';return}
 if(['ja','en','zh','ko','pt'].includes(resolved.code))return choosePresetLanguage(resolved.code);
 customLanguageBusy=true;
 status.textContent=udc('translationPreparing')||'この言語を準備しています…';
 const ready=await api?.prepareTarget?.(resolved.code);
 if(!ready?.ok){status.textContent=ready?.message||udc('translationUnavailable')||'この端末ではこの言語への自動翻訳を準備できません。上の5言語を選ぶこともできます。';customLanguageBusy=false;return}
 const challenge=resetVisionChallenge();firstRunColorValue=challenge.start;firstRunColorChosen=false;
 firstRunLanguageChosen=true;firstRunStep='color';
 SaijoPrefs.save({language:'custom',customLanguage:resolved.code,customLanguageLabel:resolved.label||input.trim(),languageConfirmed:false,onboardingDone:false});
 refreshLanguage();
 reopenFirstSetup();
 const overlay=document.getElementById('udOverlay');
 if(overlay){overlay.setAttribute('aria-busy','true');await api.translateSubtree?.(overlay);overlay.removeAttribute('aria-busy')}
 customLanguageBusy=false;
}

   slider.dataset.adjusted='true';
   if(first){firstRunColorChosen=true;firstRunColorValue=v;}
   if(colorSave)colorSave.disabled=first?!firstRunColorChosen:false;

   visionChallenge=null;
   if(first){document.body.classList.remove('ud-required');closeUd(true);refreshLanguage();if(isCustomLanguage())await window.SaijoCustomTranslate?.translatePage?.()}else{refreshLanguage();ensureUd(false);showStep('settings')}
 });

}

function montblancHomageMotion(){
 if(!document.body.classList.contains('mb-home')||innerWidth<900||prefs().reduceMotion||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const hero=document.querySelector('.mb-hero');
 const media=document.querySelector('.mb-hero-media img');
 const cards=[...document.querySelectorAll('.mb-work')];
 let raf=0;
 const move=(e)=>{
   if(raf)return;
   raf=requestAnimationFrame(()=>{
     raf=0;
     if(hero&&media){const r=hero.getBoundingClientRect();if(e.clientY>=r.top&&e.clientY<=r.bottom){const x=(e.clientX/innerWidth-.5)*10;const y=(e.clientY/innerHeight-.5)*7;media.style.transform=`scale(1.08) translate(${x}px,${y}px)`}}
     cards.forEach(card=>{const r=card.getBoundingClientRect();if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom){const x=(e.clientX-r.left)/r.width-.5;const y=(e.clientY-r.top)/r.height-.5;card.style.setProperty('--mx',`${x*6}px`);card.style.setProperty('--my',`${y*6}px`)}else{card.style.setProperty('--mx','0px');card.style.setProperty('--my','0px')}});
   });
 };
 addEventListener('pointermove',move,{passive:true});
}

function playOpeningSequence(){
 const opening=document.getElementById('siteOpening');
 if(!opening){document.documentElement.classList.remove('opening-pending');return Promise.resolve()}
 const count=opening.querySelector('[data-opening-count]');
 const reduce=prefs().reduceMotion||matchMedia('(prefers-reduced-motion: reduce)').matches;
 opening.classList.add('is-running');
 return new Promise(resolve=>{
   if(reduce){
     if(count)count.textContent='100';
     window.setTimeout(()=>{opening.classList.add('is-leaving','is-reduced');window.setTimeout(()=>{opening.remove();document.documentElement.classList.remove('opening-pending');document.body.classList.add('page-opened');resolve()},180)},320);
     return;
   }
   const started=performance.now();
   const duration=2050;
   const tick=(now)=>{
     const q=Math.min(1,(now-started)/duration);
     if(count)count.textContent=String(Math.round(q*100)).padStart(2,'0');
     if(q<1)requestAnimationFrame(tick);
   };
   requestAnimationFrame(tick);
   window.setTimeout(()=>{
     opening.classList.add('is-leaving');
     window.setTimeout(()=>{
       opening.remove();
       document.documentElement.classList.remove('opening-pending');
       document.body.classList.add('page-opened');
       resolve();
     },850);
   },duration);
 });
}

/* V9: horizontal-strip cinematic scroll inspired by the supplied motion reference. */
function cinematicSequence(){
 const section=document.querySelector('[data-cinema]');
 if(!section)return;
 const reduce=()=>prefs().reduceMotion||matchMedia('(prefers-reduced-motion: reduce)').matches;
 const stage=section.querySelector('.cinematic-sticky');
 const a=section.querySelector('.cinema-scene-a');
 const b=section.querySelector('.cinema-scene-b');
 const c=section.querySelector('.cinema-scene-c');
 const counter=section.querySelector('[data-cinema-current]');
 const progressBar=section.querySelector('[data-cinema-progress]');
 const layers=[...section.querySelectorAll('[data-cinema-layer]')];
 const stripCount=9;
 layers.forEach(layer=>{
   if(layer.children.length)return;
   const src=layer.dataset.src;
   for(let i=0;i<stripCount;i++){
     const f=document.createElement('figure');
     f.className='cinema-strip';
     const top=(i/stripCount)*100;
     const bottom=100-((i+1)/stripCount)*100;
     f.style.clipPath=`inset(${top}% 0 ${bottom}% 0)`;
     f.dataset.i=String(i);
     f.innerHTML=`<img src="${src}" alt="">`;
     layer.appendChild(f);
   }
 });
 const layerB=section.querySelector('[data-cinema-layer="b"]');
 const layerC=section.querySelector('[data-cinema-layer="c"]');
 const clamp=v=>Math.max(0,Math.min(1,v));
 const ease=t=>1-Math.pow(1-clamp(t),3);
 const paintLayer=(layer,t)=>{
   const items=[...layer.children];

"use strict";
(() => {
  const SUPPORTED = [
    "ar","bg","bn","cs","da","de","el","en","es","fi","fr","hi","hr","hu","id","it","he","kn","lt","mr","nl","no","pl","pt","ro","ru","sk","sl","sv","ta","te","th","tr","uk","vi","zh","zh-Hant","ja","ko"
  ];
  const STATIC = new Set(["ja","en","zh","ko","pt"]);
  const JAPANESE = /[\u3040-\u30ff\u3400-\u9fff]/;
  const translatorCache = new Map();
  const textState = new WeakMap();
  const textCache = new Map();
  let observer = null;
  let scanTimer = 0;

  const normalizeText = value => String(value || "").trim().toLocaleLowerCase();
  const apiCode = code => code === "he" ? "iw" : code;
  const storageCode = code => code === "iw" ? "he" : code;

  function displayName(code, locale) {
    try { return new Intl.DisplayNames([locale], { type: "language" }).of(code) || code; }
    catch (_) { return code; }
  }

  function resolveLanguage(input) {
    const raw = String(input || "").trim();
    if (!raw) return null;
    const simple = storageCode(raw.replace(/_/g, "-"));
    const direct = SUPPORTED.find(c => c.toLocaleLowerCase() === simple.toLocaleLowerCase());
    if (direct) return { code: direct, label: displayName(direct, direct === "zh-Hant" ? "zh-Hant" : direct) };

    const needle = normalizeText(raw).replace(/[\s・·()（）_-]+/g, "");
    const manual = {
      "フランス語":"fr","francais":"fr","français":"fr","french":"fr",
      "スペイン語":"es","espanol":"es","español":"es","spanish":"es",
      "ドイツ語":"de","deutsch":"de","german":"de",
      "イタリア語":"it","italiano":"it","italian":"it",
      "タイ語":"th","ไทย":"th","thai":"th",
      "ベトナム語":"vi","tiếngviệt":"vi","vietnamese":"vi",
      "インドネシア語":"id","bahasaindonesia":"id","indonesian":"id",
      "ヒンディー語":"hi","हिन्दी":"hi","hindi":"hi",
      "アラビア語":"ar","العربية":"ar","arabic":"ar",
      "ロシア語":"ru","русский":"ru","russian":"ru",
      "ウクライナ語":"uk","українська":"uk","ukrainian":"uk",
      "トルコ語":"tr","türkçe":"tr","turkish":"tr",
      "オランダ語":"nl","nederlands":"nl","dutch":"nl",
      "スウェーデン語":"sv","svenska":"sv","swedish":"sv",
      "ポーランド語":"pl","polski":"pl","polish":"pl",
      "ルーマニア語":"ro","română":"ro","romanian":"ro",
      "ギリシャ語":"el","ελληνικά":"el","greek":"el",
      "ヘブライ語":"he","עברית":"he","hebrew":"he",
      "繁体字中国語":"zh-Hant","繁體中文":"zh-Hant","traditionalchinese":"zh-Hant"
    };
    if (manual[needle]) {
      const code = manual[needle];
      return { code, label: displayName(code, code === "zh-Hant" ? "zh-Hant" : code) };
    }

    for (const code of SUPPORTED) {
      const names = new Set([
        displayName(code, "ja"),
        displayName(code, "en"),
        displayName(code, code === "zh-Hant" ? "zh-Hant" : code)
      ]);
      for (const name of names) {
        const n = normalizeText(name).replace(/[\s・·()（）_-]+/g, "");
        if (n && n === needle) return { code, label: name };
      }
    }
    return null;
  }

  function currentTarget() {
    const p = window.SaijoPrefs?.load?.();
    return p?.language === "custom" ? p.customLanguage : "";
  }

  async function prepareTarget(code) {
    const target = storageCode(code);
    if (!target || STATIC.has(target)) return { ok: true, code: target, native: true };
    if (!("Translator" in self)) {
      return { ok: false, code: target, message: "このブラウザでは端末内の自動翻訳機能を利用できません。" };
    }
    const key = `ja>${target}`;
    if (translatorCache.has(key)) return { ok: true, code: target, translator: translatorCache.get(key) };
    try {
      const targetForApi = apiCode(target);
      const availability = await self.Translator.availability({ sourceLanguage: "ja", targetLanguage: targetForApi });
      if (availability === "unavailable") return { ok: false, code: target, message: "この言語の翻訳モデルはこの端末で利用できません。" };
      const translator = await self.Translator.create({ sourceLanguage: "ja", targetLanguage: targetForApi });
      translatorCache.set(key, translator);
      return { ok: true, code: target, translator, availability };
    } catch (error) {
      console.warn("Custom translation setup failed", error);
      return { ok: false, code: target, message: "この言語への自動翻訳を準備できませんでした。" };
    }
  }

  async function translateString(text, target, translator) {
    const value = String(text || "");
    if (!JAPANESE.test(value)) return value;
    const key = `${target}\u0000${value}`;
    if (textCache.has(key)) return textCache.get(key);
    try {
      const out = await translator.translate(value);
      textCache.set(key, out);
      return out;
    } catch (error) {
      console.warn("Translation failed", value, error);
      return value;
    }
  }

  function ignored(node) {
    const el = node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement;
    if (!el) return true;
    return !!el.closest("script,style,noscript,code,pre,svg,canvas,[data-no-auto-translate],.notranslate,.maplibregl-ctrl-attrib");
  }

  function textNodes(root) {
    const out = [];
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode(node) {
        const value = node.nodeValue || "";
        if (!value.trim() || !JAPANESE.test(value) || ignored(node)) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    while (walker.nextNode()) out.push(walker.currentNode);
    return out;
  }

  async function translateTextNode(node, target, translator) {
    const source = node.nodeValue || "";
    const state = textState.get(node);
    if (state && source === state.output) return;
    if (!JAPANESE.test(source)) return;
    const output = await translateString(source, target, translator);
    if (node.isConnected && node.nodeValue === source) {
      textState.set(node, { source, output });
      node.nodeValue = output;
    }
  }

  async function translateAttributes(root, target, translator) {
    const nodes = [];
    if (root.nodeType === Node.ELEMENT_NODE) nodes.push(root);
    root.querySelectorAll?.("[aria-label],[title],[placeholder],[alt]").forEach(el => nodes.push(el));
    for (const el of nodes) {
      if (ignored(el)) continue;
      for (const attr of ["aria-label","title","placeholder","alt"]) {
        if (!el.hasAttribute?.(attr)) continue;
        const value = el.getAttribute(attr) || "";
        if (!JAPANESE.test(value)) continue;
        const mark = `data-translated-${attr.replace('aria-','aria-')}`;
        if (el.getAttribute(mark) === value) continue;
        const output = await translateString(value, target, translator);
        el.setAttribute(attr, output);
        el.setAttribute(mark, output);
      }
    }
  }

  async function translateSubtree(root = document.body) {
    const target = currentTarget();
    if (!target || STATIC.has(target) || !root) return { ok: true, skipped: true };
    const ready = await prepareTarget(target);
    if (!ready.ok) return ready;
    const translator = ready.translator;
    const nodes = textNodes(root);
    const concurrency = 4;
    let cursor = 0;
    async function worker() {
      while (cursor < nodes.length) {
        const node = nodes[cursor++];
        await translateTextNode(node, target, translator);
      }
    }
    await Promise.all(Array.from({ length: Math.min(concurrency, nodes.length || 1) }, worker));
    await translateAttributes(root, target, translator);
    return { ok: true, count: nodes.length };
  }

  async function translatePage() {
    const p = window.SaijoPrefs?.load?.();
    if (p?.language !== "custom" || !p.customLanguage || !p.onboardingDone) return { ok: true, skipped: true };
    document.documentElement.lang = p.customLanguage;
    document.documentElement.dir = /^(ar|he|iw)(-|$)/i.test(p.customLanguage) ? "rtl" : "ltr";
    document.body?.classList.add("custom-translation-active");
    const result = await translateSubtree(document.body);
    if (JAPANESE.test(document.title)) {
      const ready = await prepareTarget(p.customLanguage);
      if (ready.ok) document.title = await translateString(document.title, p.customLanguage, ready.translator);
    }
    startObserver();
    return result;
  }

  function scheduleScan() {
    clearTimeout(scanTimer);
    scanTimer = setTimeout(() => translatePage(), 120);
  }

  function startObserver() {
    if (observer || !document.body) return;
    observer = new MutationObserver(mutations => {
      if (mutations.some(m => m.type === "childList" || m.type === "characterData")) scheduleScan();
    });
    observer.observe(document.body, { subtree: true, childList: true, characterData: true });
  }

  window.SaijoCustomTranslate = { resolveLanguage, prepareTarget, translateSubtree, translatePage, supportedLanguages: [...SUPPORTED] };

  document.addEventListener("DOMContentLoaded", () => {
    const p = window.SaijoPrefs?.load?.();
    if (p?.language === "custom" && p.customLanguage && p.onboardingDone) {
      setTimeout(() => translatePage(), 60);
    }
  });
})();


(() => {
  'use strict';

  const ROOT = 'audio/ui/';
  const SOURCES = {
    open: ROOT + 'site-open.mp3',
    tap: ROOT + 'tap.mp3',
    page: ROOT + 'page-transition.mp3'
  };

  const makeAudio = (src, volume) => {
    const audio = new Audio(src);
    audio.preload = 'auto';
    audio.volume = volume;
    return audio;
  };

  const sounds = {
    open: makeAudio(SOURCES.open, 0.58),
    tap: makeAudio(SOURCES.tap, 0.46),
    page: makeAudio(SOURCES.page, 0.56)
  };

  let openingPending = document.body?.dataset.page === 'home';
  let suppressNextClickSound = false;
  let navigating = false;

  const replay = (audio) => {
    try {
      audio.pause();
      audio.currentTime = 0;
      const result = audio.play();
      if (result && typeof result.catch === 'function') result.catch(() => {});
    } catch (_) {}
  };

  const tryOpeningSound = () => {
    if (!openingPending) return;
    openingPending = false;
    try {
      sounds.open.currentTime = 0;
      const p = sounds.open.play();
      if (p && typeof p.catch === 'function') {
        p.catch(() => { openingPending = true; });
      }
    } catch (_) {
      openingPending = true;
    }
  };

  // Browsers often block autoplay. Try once on load, then replay on the
  // first real user interaction if it was blocked.
  if (document.body?.dataset.page === 'home') {
    window.setTimeout(tryOpeningSound, 120);

    const unlockOpening = () => {
      if (!openingPending) return;
      suppressNextClickSound = true;
      tryOpeningSound();
    };
    window.addEventListener('pointerdown', unlockOpening, { capture: true, once: true });
    window.addEventListener('keydown', unlockOpening, { capture: true, once: true });
  }

  const isInternalNavigation = (anchor) => {
    if (!anchor || !anchor.href) return false;
    if (anchor.hasAttribute('download')) return false;
    if (anchor.target && anchor.target !== '_self') return false;

    const raw = anchor.getAttribute('href') || '';
    if (!raw || raw.startsWith('#') || raw.startsWith('javascript:') || raw.startsWith('mailto:') || raw.startsWith('tel:')) return false;

    try {
      const url = new URL(anchor.href, location.href);
      if (url.protocol === 'http:' || url.protocol === 'https:') {
        return url.origin === location.origin;
      }
      return url.protocol === location.protocol;
    } catch (_) {
      return false;
    }
  };

  document.addEventListener('click', (event) => {
    if (!event.isTrusted) return;

    if (suppressNextClickSound) {
      suppressNextClickSound = false;
      return;
    }

    const anchor = event.target.closest('a[href]');
    if (anchor) {
      if (event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;

      if (isInternalNavigation(anchor) && !navigating) {
        event.preventDefault();
        navigating = true;
        replay(sounds.page);
        const href = anchor.href;
        // The supplied transition sound starts immediately; the longer delay also lets
        // the seven-strip brewery transition become visually legible.
        window.setTimeout(() => { location.href = href; }, 540);
      } else {
        replay(sounds.tap);
      }
      return;
    }

    const interactive = event.target.closest(
      'button, [role="button"], input, select, textarea, summary, .place-marker, .maplibregl-marker'
    );
    if (interactive && !interactive.disabled && interactive.getAttribute('aria-disabled') !== 'true') {
      replay(sounds.tap);
    }
  }, true);

  // Expose a tiny API for future map/site actions that are triggered from JS.
  window.SaijoUISounds = Object.freeze({
    tap: () => replay(sounds.tap),
    page: () => replay(sounds.page),
    open: () => replay(sounds.open)
  });
})();

(function () {

  function addSkipLink() {

    if (!body || body.querySelector('.saijo-skip-link, .v64-skip')) return;

    if (!main.id) main.id = 'main-content';

      window.setTimeout(function () {
        main.focus({ preventScroll: true });
      }, 0);
    });
    body.insertBefore(link, body.firstChild);
  }

  function groupMapActions() {
    if (!document.body.classList.contains('map-page')) return;
    const controls = document.getElementById('mainControls');
    if (!controls || controls.dataset.compactControls === 'true') return;

    const byId = (id) => controls.querySelector('#' + id);
    const current = byId('locationButton');
    const places = byId('placesButton');
    const route = byId('routePlannerButton');
    const overview = byId('overviewButton');
    const station = byId('stationButton');
    const ud = byId('udButton');

    more.className = 'map-more-actions';
    more.innerHTML = '<summary aria-label="その他の地図操作"><span class="control-icon" aria-hidden="true">＋</span><span>その他</span></summary><div class="map-more-actions-panel" role="group" aria-label="その他の地図操作"></div>';
    const panel = more.querySelector('.map-more-actions-panel');

    panel.append(overview, station, ud);
    controls.replaceChildren(current, places, route, more);
    controls.dataset.compactControls = 'true';

    const summary = more.querySelector('summary');
    const syncExpanded = () => summary.setAttribute('aria-expanded', String(more.open));
    more.addEventListener('toggle', syncExpanded);
    syncExpanded();

    panel.addEventListener('click', function (event) {

        more.open = false;

    // A control must remain visible and usable when the user asks for larger text.
    document.querySelectorAll('button, [role="button"], input, select, textarea').forEach(function (control) {
      if (!control.style.minHeight) control.style.minHeight = '44px';
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', enhanceControls, { once: true });
  } else {
    enhanceControls();
  }
})();

</script>
