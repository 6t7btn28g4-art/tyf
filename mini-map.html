<script id="github-pages-v70-js">


/* ===== GitHub Pages V70 bundled JS ===== */
"use strict";
(() => {
  const miniRoot = document.getElementById("miniMap");
  const showMiniFallback = (message) => {
    if (!miniRoot) return;
    miniRoot.innerHTML = `<div class="mini-map-fallback"><div class="mini-map-fallback-card"><strong>地図を表示できません</strong><p>${message || "地図データを読み込めませんでした。"}</p><a href="./map.html">地図を開く</a></div></div>`;
  };
  if (!window.maplibregl || typeof window.maplibregl.Map !== "function") {
    showMiniFallback("地図ライブラリの読み込みに失敗しました。メインの地図ページをご利用ください。");
    return;
  }
  const STYLE = "https://tiles.openfreemap.org/styles/liberty";
  const NODES = {
    "saijo-station":[132.743606,34.431097], stationSouth:[132.743780,34.430730], centralWest:[132.744450,34.430520],
    westA:[132.743050,34.430650], westB:[132.742180,34.430210], westC:[132.741350,34.429820], sanyotsuru:[132.740825,34.429666],
    southA:[132.744520,34.429850], hakubotan:[132.745133,34.429412], kamotsuru:[132.745402,34.430414], saijotsuru:[132.745620,34.430238],
    kirei:[132.746323,34.430119], gateWest:[132.746420,34.429850], kugurimon:[132.746796,34.429599], northEast:[132.746350,34.430610],
    fukubijin:[132.747731,34.430674], eastMid:[132.748150,34.430050], eastSouth:[132.747650,34.429360], kamoizumi:[132.748630,34.429061],
    "tourist-info-station":[132.743735,34.431120], "sakagura-info":[132.746735,34.429655], "kugurimon-toilet":[132.746875,34.429555],
    "kugurimon-coffee":[132.746650,34.429565], "historical-square":[132.745350,34.429455], boulevardNorth:[132.743650,34.430050],
    boulevardMid:[132.743300,34.428650], kurara:[132.7424747,34.4283545], "city-museum":[132.7423088,34.4271133], museumEast:[132.743300,34.427120],
    cityCenterEast:[132.746050,34.427120], yumeWest:[132.748650,34.427000], "yume-town":[132.7500214,34.4269265]
  };
  const EDGES = [
    ["saijo-station","stationSouth"],["stationSouth","centralWest"],["stationSouth","westA"],["westA","westB"],["westB","westC"],["westC","sanyotsuru"],
    ["centralWest","kamotsuru"],["centralWest","southA"],["southA","hakubotan"],["kamotsuru","saijotsuru"],["saijotsuru","kirei"],["kirei","gateWest"],
    ["gateWest","kugurimon"],["hakubotan","kugurimon"],["kamotsuru","northEast"],["northEast","fukubijin"],["fukubijin","eastMid"],["eastMid","kamoizumi"],
    ["kugurimon","eastSouth"],["eastSouth","kamoizumi"],["saijo-station","tourist-info-station"],["kugurimon","sakagura-info"],["kugurimon","kugurimon-toilet"],
    ["kugurimon","kugurimon-coffee"],["hakubotan","historical-square"],["stationSouth","boulevardNorth"],["boulevardNorth","boulevardMid"],["boulevardMid","kurara"],
    ["kurara","city-museum"],["city-museum","museumEast"],["museumEast","cityCenterEast"],["cityCenterEast","yumeWest"],["yumeWest","yume-town"]
  ];
  const LABELS = {"saijo-station":"JR",sanyotsuru:"1",hakubotan:"2",saijotsuru:"3",kamotsuru:"4",kirei:"5",fukubijin:"6",kamoizumi:"7",kugurimon:"門",kurara:"文","city-museum":"美","yume-town":"買","sakagura-info":"案"};

  function metres(a,b){
    const R=6371000, r=Math.PI/180, dLat=(b[1]-a[1])*r, dLng=(b[0]-a[0])*r;
    const q=Math.sin(dLat/2)**2+Math.cos(a[1]*r)*Math.cos(b[1]*r)*Math.sin(dLng/2)**2;
    return 2*R*Math.atan2(Math.sqrt(q),Math.sqrt(1-q));
  }
  function shortest(start,end){
    if(!NODES[start]||!NODES[end]) return null;
    const graph={}; Object.keys(NODES).forEach(k=>graph[k]=[]);
    EDGES.forEach(([a,b])=>{const w=metres(NODES[a],NODES[b]);graph[a].push([b,w]);graph[b].push([a,w])});
    const dist={},prev={},todo=new Set(Object.keys(NODES)); Object.keys(NODES).forEach(k=>dist[k]=Infinity);dist[start]=0;
    while(todo.size){let u=null,best=Infinity;for(const k of todo){if(dist[k]<best){best=dist[k];u=k}}if(u===null)break;todo.delete(u);if(u===end)break;
      for(const [v,w] of graph[u]){if(!todo.has(v))continue;const alt=dist[u]+w;if(alt<dist[v]){dist[v]=alt;prev[v]=u}}}
    if(!Number.isFinite(dist[end])) return null;
    const ids=[];for(let u=end;u;u=prev[u]){ids.push(u);if(u===start)break}ids.reverse();

  }
  function marker(label,kind){const el=document.createElement("div");el.className=`mini-marker ${kind||""}`;el.textContent=label;return el}
  function boundsOf(coords){const b=new maplibregl.LngLatBounds();coords.forEach(c=>b.extend(c));return b}
  function waitForSize(map){
    let count=0; const tick=()=>{map.resize(); if(++count<8) requestAnimationFrame(tick)}; requestAnimationFrame(tick);
    if("ResizeObserver" in window){new ResizeObserver(()=>map.resize()).observe(document.body)}
  }

  const params=new URLSearchParams(location.search);
  const from=params.get("from")||"saijo-station";
  const to=params.get("to")||params.get("place")||"kamotsuru";
  const route=params.get("from")||params.get("to") ? shortest(from,to) : null;
  const focus=NODES[to]||NODES["kamotsuru"];
  const map=new maplibregl.Map({container:"miniMap",style:STYLE,center:focus,zoom:16.8,pitch:0,bearing:0,interactive:false,attributionControl:false,fadeDuration:0});
  waitForSize(map);
  let miniMapLoaded = false;
  map.on("load",()=>{
    miniMapLoaded = true;
    if(route&&route.length>1){
      map.addSource("mini-route",{type:"geojson",data:{type:"Feature",properties:{},geometry:{type:"LineString",coordinates:route}}});
      map.addLayer({id:"mini-route-casing",type:"line",source:"mini-route",paint:{"line-color":"#ffffff","line-width":9,"line-opacity":.96}});
      map.addLayer({id:"mini-route-line",type:"line",source:"mini-route",paint:{"line-color":"#006fbf","line-width":5.5,"line-opacity":1}});
      new maplibregl.Marker({element:marker(LABELS[from]||"START")}).setLngLat(NODES[from]).addTo(map);
      new maplibregl.Marker({element:marker(LABELS[to]||"●","destination")}).setLngLat(NODES[to]).addTo(map);
      map.fitBounds(boundsOf(route),{padding:{top:34,right:38,bottom:34,left:38},duration:0,maxZoom:17.7});
    }else{
      new maplibregl.Marker({element:marker(LABELS[to]||"●","destination")}).setLngLat(focus).addTo(map);
      map.jumpTo({center:focus,zoom:17.1});
    }
    map.resize();
  });
  map.on("styledata",()=>map.resize());
  map.on("error", (event) => { console.warn("Mini map error:", event?.error || event); });
  window.setTimeout(() => {
    if (!miniMapLoaded && miniRoot && !miniRoot.querySelector(".mini-map-fallback")) {
      showMiniFallback("地図データの読み込みに時間がかかっています。通信環境を確認してください。");
    }
  }, 15000);
})();


(() => {
  'use strict';

  const ROOT = 'audio/ui/';
  const SOURCES = {
    open: ROOT + 'site-open.mp3',
    tap: ROOT + 'tap.mp3',
    page: ROOT + 'page-transition.mp3'
  };

  const makeAudio = (src, volume) => {
    const audio = new Audio(src);
    audio.preload = 'auto';
    audio.volume = volume;
    return audio;
  };

  const sounds = {
    open: makeAudio(SOURCES.open, 0.58),
    tap: makeAudio(SOURCES.tap, 0.46),
    page: makeAudio(SOURCES.page, 0.56)
  };

  let openingPending = document.body?.dataset.page === 'home';
  let suppressNextClickSound = false;
  let navigating = false;

  const replay = (audio) => {
    try {
      audio.pause();
      audio.currentTime = 0;
      const result = audio.play();
      if (result && typeof result.catch === 'function') result.catch(() => {});
    } catch (_) {}
  };

  const tryOpeningSound = () => {
    if (!openingPending) return;
    openingPending = false;
    try {
      sounds.open.currentTime = 0;
      const p = sounds.open.play();
      if (p && typeof p.catch === 'function') {
        p.catch(() => { openingPending = true; });
      }
    } catch (_) {
      openingPending = true;
    }
  };

  // Browsers often block autoplay. Try once on load, then replay on the
  // first real user interaction if it was blocked.
  if (document.body?.dataset.page === 'home') {
    window.setTimeout(tryOpeningSound, 120);

    const unlockOpening = () => {
      if (!openingPending) return;
      suppressNextClickSound = true;
      tryOpeningSound();
    };
    window.addEventListener('pointerdown', unlockOpening, { capture: true, once: true });
    window.addEventListener('keydown', unlockOpening, { capture: true, once: true });
  }

  const isInternalNavigation = (anchor) => {
    if (!anchor || !anchor.href) return false;
    if (anchor.hasAttribute('download')) return false;
    if (anchor.target && anchor.target !== '_self') return false;

    const raw = anchor.getAttribute('href') || '';
    if (!raw || raw.startsWith('#') || raw.startsWith('javascript:') || raw.startsWith('mailto:') || raw.startsWith('tel:')) return false;

    try {
      const url = new URL(anchor.href, location.href);
      if (url.protocol === 'http:' || url.protocol === 'https:') {
        return url.origin === location.origin;
      }
      return url.protocol === location.protocol;
    } catch (_) {
      return false;
    }
  };

  document.addEventListener('click', (event) => {
    if (!event.isTrusted) return;

    if (suppressNextClickSound) {
      suppressNextClickSound = false;
      return;
    }

    const anchor = event.target.closest('a[href]');
    if (anchor) {
      if (event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;

      if (isInternalNavigation(anchor) && !navigating) {
        event.preventDefault();
        navigating = true;
        replay(sounds.page);
        const href = anchor.href;
        // The supplied transition sound starts immediately; the longer delay also lets
        // the seven-strip brewery transition become visually legible.
        window.setTimeout(() => { location.href = href; }, 540);
      } else {
        replay(sounds.tap);
      }
      return;
    }

    const interactive = event.target.closest(
      'button, [role="button"], input, select, textarea, summary, .place-marker, .maplibregl-marker'
    );
    if (interactive && !interactive.disabled && interactive.getAttribute('aria-disabled') !== 'true') {
      replay(sounds.tap);
    }
  }, true);

  // Expose a tiny API for future map/site actions that are triggered from JS.
  window.SaijoUISounds = Object.freeze({
    tap: () => replay(sounds.tap),
    page: () => replay(sounds.page),
    open: () => replay(sounds.open)
  });
})();

</script>
  
<script data-bundled-from="compact-ui.js">
/* SAIJO V72: concise controls and screen-reader/keyboard support. */
(function () {
  'use strict';

  function addSkipLink() {
    const body = document.body;
    if (!body || body.querySelector('.saijo-skip-link, .v64-skip')) return;
    const main = document.querySelector('main');
    if (!main) return;
    if (!main.id) main.id = 'main-content';
    if (!main.hasAttribute('tabindex')) main.setAttribute('tabindex', '-1');

    const link = document.createElement('a');
    link.className = 'saijo-skip-link';
    link.href = '#' + main.id;
    link.textContent = '本文へ移動';
    link.addEventListener('click', function () {
      window.setTimeout(function () {
        main.focus({ preventScroll: true });
      }, 0);
    });
    body.insertBefore(link, body.firstChild);
  }

  function groupMapActions() {
    if (!document.body.classList.contains('map-page')) return;
    const controls = document.getElementById('mainControls');
    if (!controls || controls.dataset.compactControls === 'true') return;

    const byId = (id) => controls.querySelector('#' + id);
    const current = byId('locationButton');
    const places = byId('placesButton');
    const route = byId('routePlannerButton');
    const overview = byId('overviewButton');
    const station = byId('stationButton');
    const ud = byId('udButton');
    if (![current, places, route, overview, station, ud].every(Boolean)) return;

    const more = document.createElement('details');
    more.className = 'map-more-actions';
    more.innerHTML = '<summary aria-label="その他の地図操作"><span class="control-icon" aria-hidden="true">＋</span><span>その他</span></summary><div class="map-more-actions-panel" role="group" aria-label="その他の地図操作"></div>';
    const panel = more.querySelector('.map-more-actions-panel');

    panel.append(overview, station, ud);
    controls.replaceChildren(current, places, route, more);
    controls.dataset.compactControls = 'true';

    const summary = more.querySelector('summary');
    const syncExpanded = () => summary.setAttribute('aria-expanded', String(more.open));
    more.addEventListener('toggle', syncExpanded);
    syncExpanded();

    // Close the popover after an action or an outside click.
    panel.addEventListener('click', function (event) {
      if (event.target.closest('button')) {
        more.open = false;
        syncExpanded();
      }
    });
    document.addEventListener('click', function (event) {
      if (more.open && !more.contains(event.target)) { more.open = false; syncExpanded(); }
    });
    more.addEventListener('keydown', function (event) {
      if (event.key === 'Escape' && more.open) {
        event.preventDefault();
        more.open = false;
        syncExpanded();
        more.querySelector('summary').focus();
      }
    });
  }

  function enhanceControls() {
    addSkipLink();
    groupMapActions();

    // Put the settings action near the top of the menu so it is easy to discover.
    const siteMenu = document.getElementById('siteMenu');
    const menuTop = siteMenu && siteMenu.querySelector('.site-menu-top');
    const settingsButton = siteMenu && siteMenu.querySelector('.menu-settings');
    if (menuTop && settingsButton && menuTop.nextElementSibling !== settingsButton) {
      menuTop.insertAdjacentElement('afterend', settingsButton);
    }

    // Name map controls explicitly, even if a compact visual state hides a text label.
    document.querySelectorAll('.map-controls button').forEach(function (button) {
      if (!button.hasAttribute('aria-label')) {
        const visibleName = button.textContent.replace(/\s+/g, ' ').trim();
        if (visibleName) button.setAttribute('aria-label', visibleName);
      }
    });

    // Ensure decorative icons don't create duplicate names for assistive technology.
    document.querySelectorAll('.v69-mobile-nav svg, .v64-menu-icon, .control-icon').forEach(function (icon) {
      if (!icon.hasAttribute('aria-hidden')) icon.setAttribute('aria-hidden', 'true');
    });

    // Keep modal-style navigation menus clearly named and accurately expanded.
    document.querySelectorAll('[data-menu-open]').forEach(function (button) {
      if (!button.hasAttribute('aria-label')) button.setAttribute('aria-label', 'メニューを開く');
      button.addEventListener('click', function () {
        const expanded = button.getAttribute('aria-expanded') === 'true';
        button.setAttribute('aria-label', expanded ? 'メニューを開く' : 'メニューを閉じる');
      });
    });

    // A control must remain visible and usable when the user asks for larger text.
    document.querySelectorAll('button, [role="button"], input, select, textarea').forEach(function (control) {
      if (!control.style.minHeight) control.style.minHeight = '44px';
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', enhanceControls, { once: true });
  } else {
    enhanceControls();
  }
})();

</script>
